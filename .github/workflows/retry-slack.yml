name: 🔄 Retry Slack Only

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Specific date to retry (YYYY-MM-DD format, optional)'
        required: false
        type: string

jobs:
  retry-slack:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Post album to Slack only (retry)
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        ALBUM_API_KEY: ${{ secrets.ALBUM_API_KEY }}
        ALBUM_FEED_URL: ${{ secrets.ALBUM_FEED_URL }}
        TARGET_DATE: ${{ inputs.date }}
        # Explicitly disable Bluesky for Slack-only retry
        POST_TO_BLUESKY: false
      run: npm start
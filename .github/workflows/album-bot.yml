name: Album of the Day Bot (All Platforms)

on:
  schedule:
    # Runs at 14:15 UTC (2:15 PM UTC) daily
    # This equals 6:15 AM PST (winter) and 7:15 AM PDT (summer)
    # 
    # CUSTOMIZE YOUR SCHEDULE:
    # For 9:00 PM GMT (21:00 UTC): "0 21 * * *"
    # For 8:00 AM EST (13:00 UTC): "0 13 * * *" 
    # For 10:00 AM CET (9:00 UTC): "0 9 * * *"
    # Use https://crontab.guru to generate custom times
    - cron: "15 14 * * *"  # 2:15 PM UTC (6:15 AM PST / 7:15 AM PDT)
  workflow_dispatch:
    inputs:
      date:
        description: 'Specific date to fetch (YYYY-MM-DD format, optional)'
        required: false
        type: string

jobs:
  post-to-slack:
    if: ${{ vars.POST_TO_SLACK != 'false' }}
    uses: ./.github/workflows/post-to-slack.yml
    secrets: inherit
    with:
      date: ${{ inputs.date }}
  
  post-to-bluesky:
    if: ${{ secrets.POST_TO_BLUESKY == 'true' }}
    uses: ./.github/workflows/post-to-bluesky.yml
    secrets: inherit
    with:
      date: ${{ inputs.date }}

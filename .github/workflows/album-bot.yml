name: Album of the Day Slack Bot

on:
  schedule:
    # Default: 6:15 AM Pacific Time (customize by editing these cron expressions)
    # Current schedule runs at 13:15 UTC (6:15 AM PDT) and 14:15 UTC (6:15 AM PST)
    # 
    # CUSTOMIZE YOUR SCHEDULE:
    # For 9:00 PM GMT (21:00 UTC): "0 21 * * *"
    # For 8:00 AM EST (13:00 UTC): "0 13 * * *" 
    # For 10:00 AM CET (9:00 UTC): "0 9 * * *"
    # Use https://crontab.guru to generate custom times
    - cron: "15 13 * * *"  # 6:15 AM PDT (UTC-7)
    - cron: "15 14 * * *"  # 6:15 AM PST (UTC-8)
  workflow_dispatch:
    inputs:
      date:
        description: 'Specific date to fetch (YYYY-MM-DD format, optional)'
        required: false
        type: string

jobs:
  post-album:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Post album to Slack
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        ALBUM_API_KEY: ${{ secrets.ALBUM_API_KEY }}
        ALBUM_FEED_URL: ${{ secrets.ALBUM_FEED_URL }}
        TARGET_DATE: ${{ inputs.date }}
      run: npm start

name: Album of the Day Slack Bot

on:
  schedule:
    # Run at 6:15 AM PDT (UTC-7) - 13:15 UTC
    - cron: "15 13 * * *"
    # Run at 6:15 AM PST (UTC-8) - 14:15 UTC  
    - cron: "15 14 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: 'Specific date to fetch (YYYY-MM-DD format, optional)'
        required: false
        type: string

jobs:
  post-album:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Post album to Slack
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        ALBUM_API_KEY: ${{ secrets.ALBUM_API_KEY }}
        ALBUM_FEED_URL: ${{ secrets.ALBUM_FEED_URL }}
        TARGET_DATE: ${{ inputs.date }}
      run: npm start

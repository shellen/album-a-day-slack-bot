name: Test Album Bot (All Platforms)

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Specific date to test (YYYY-MM-DD format, optional)'
        required: false
        type: string

jobs:
  test-slack:
    uses: ./.github/workflows/test-slack.yml
    secrets: inherit
    with:
      date: ${{ inputs.date }}
  
  test-bluesky:
    uses: ./.github/workflows/test-bluesky.yml
    secrets: inherit
    with:
      date: ${{ inputs.date }}

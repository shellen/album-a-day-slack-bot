name: Post Album to Bluesky

on:
  workflow_call:
    inputs:
      date:
        description: 'Specific date to fetch (YYYY-MM-DD format, optional)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      date:
        description: 'Specific date to fetch (YYYY-MM-DD format, optional)'
        required: false
        type: string

jobs:
  post-to-bluesky:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Post album to Bluesky only
      env:
        # Disable Slack for Bluesky-only runs
        SLACK_WEBHOOK_URL: ""
        ALBUM_API_KEY: ${{ secrets.ALBUM_API_KEY }}
        ALBUM_FEED_URL: ${{ secrets.ALBUM_FEED_URL }}
        TARGET_DATE: ${{ inputs.date }}
        # Enable Bluesky posting
        POST_TO_BLUESKY: true
        BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
        BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
      run: npm start